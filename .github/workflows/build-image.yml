# Builds the GGULPING image on GitHub's free runners and pushes it to
#   ghcr.io/<your-github-user>/ggulping:{latest, llama.cpp-<release>}
# then runs `ggulp selftest` inside it (tiny model, CPU only, nothing uploaded).
name: build image

on:
  workflow_dispatch:
    inputs:
      llama_cpp:
        description: "llama.cpp version: empty = the one pinned in the Dockerfile, newest = the newest release, or a tag like b12400"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["Dockerfile", "ggulp/**", "rootfs/**", ".github/workflows/build-image.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space (the image is ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/julia* \
                      /opt/az /opt/microsoft /opt/google /usr/lib/jvm /usr/local/share/chromium || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h / /mnt || true

      - name: Put Docker storage on the big /mnt disk
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image names, tags and llama.cpp version
        id: names
        env:
          WANT: ${{ inputs.llama_cpp }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ggulping"
          pinned=$(grep -oP '^ARG LLAMA_CPP_REF=\K\S+' Dockerfile)
          case "${WANT}" in
            "") ref="$pinned" ;;
            newest) ref=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp | awk -F/ '{print $3}' | grep -E '^b[0-9]+$' | sort -V | tail -1) ;;
            *) ref="$WANT" ;;
          esac
          echo "llama.cpp ${ref}"
          {
            echo "image=${image}"
            echo "base=ghcr.io/${owner}/axolotl-forge:latest"
            echo "ref=${ref}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:llama.cpp-${ref}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=GGULPING - every llama.cpp GGUF of a model, up to the Hugging Face Hub
          build-args: |
            BASE_IMAGE=${{ steps.names.outputs.base }}
            LLAMA_CPP_REF=${{ steps.names.outputs.ref }}
            BUILD_JOBS=4
          # every stage is cached (mode=max), so llama.cpp only rebuilds when its version changes
          cache-from: type=registry,ref=${{ steps.names.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.names.outputs.image }}:buildcache,mode=max

      - name: Selftest (tiny model, CPU only, nothing uploaded)
        run: |
          docker pull "${{ steps.names.outputs.image }}:latest"
          docker run --rm -e COLUMNS=120 "${{ steps.names.outputs.image }}:latest" ggulp selftest --imatrix

      - name: Done
        run: |
          echo "### pushed (llama.cpp ${{ steps.names.outputs.ref }})" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.names.outputs.tags }}' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
